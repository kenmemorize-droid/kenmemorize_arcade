<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5116537956642384"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenmemorize Arcade</title>
<style>
  /* ============ THEME ============
     Neon — the only theme; the picker was removed on request.
     Kept as CSS custom properties (not hand-inlined) so a theme
     switcher could be reintroduced later without a rewrite. */
  :root{
    --bg-base:#14103A;
    --bg-1:#241C66;
    --bg-2:#2A1F5E;
    --panel:#1E1854;
    --panel-raised:#241C66;
    --score-bg:#0F0C2C;
    --text:#F5F3FF;
    --dim:#9C93D9;
    --marquee:#FFC94D;
    --marquee-border:#FFC94D;
    --glow:0.45;                 /* hover glow opacity multiplier */
    --chip-bg:#1E1854;
    --chip-border:rgba(255,255,255,0.10);
    --c-spatial:#2FE6E6;
    --c-visual:#FF3E9A;
    --c-numeric:#FFC94D;
    --c-sequence:#A6FF4D;
    --c-logic:#B18CFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, var(--bg-1) 0%, transparent 45%),
      radial-gradient(circle at 85% 10%, var(--bg-2) 0%, transparent 40%),
      var(--bg-base);
    color:var(--text);
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    padding:24px 18px 60px;
    transition:background 0.3s ease, color 0.3s ease;
  }

  /* ---------- Header ---------- */
  header{ max-width:1100px; margin:0 auto 18px; text-align:center; }
  .marquee{
    display:inline-block; padding:9px 26px;
    border:3px solid var(--marquee-border); border-radius:999px;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--marquee-border) 12%, transparent);
    font-weight:800; font-size:1.8rem; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--marquee);
  }
  header p{ margin:12px auto 0; color:var(--dim); font-size:0.92rem; max-width:460px; }

  /* ---------- Filter chips ---------- */
  .filters{
    max-width:1100px; margin:22px auto 6px;
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  }
  .chip{
    cursor:pointer; border:1.5px solid var(--chip-border); background:var(--chip-bg);
    color:var(--dim); border-radius:999px; padding:6px 15px; font-size:0.78rem;
    font-weight:700; letter-spacing:0.02em; transition:all 0.15s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip[aria-pressed="true"]{ color:var(--text); border-color:var(--chip-c, var(--marquee)); background:color-mix(in srgb, var(--chip-c, var(--marquee)) 14%, var(--chip-bg)); }
  .chip .dot{ width:9px; height:9px; border-radius:50%; background:var(--chip-c, var(--marquee)); }

  /* ---------- Section headers ---------- */
  .section-head{
    max-width:1100px; margin:26px auto 14px; display:flex; align-items:center; gap:12px;
  }
  .section-head h2{
    margin:0; font-size:0.92rem; font-weight:800; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--sc, var(--marquee)); white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .section-head .rule{ flex-grow:1; height:2px; background:linear-gradient(90deg, var(--sc, var(--marquee)), transparent); border-radius:2px; }
  .section-head .count{ font-family:"SFMono-Regular","Menlo","Consolas",monospace; font-size:0.8rem; color:var(--dim); }

  /* ---------- Grid & cards ---------- */
  .grid{
    max-width:1100px; margin:0 auto;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px;
  }
  .card{
    position:relative; background:var(--panel); border-radius:20px; padding:20px 18px 16px;
    border:2px solid var(--chip-border); box-shadow:0 8px 22px rgba(0,0,0,0.28);
    opacity:0; transform:translateY(14px); animation:riseIn 0.5s ease forwards;
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display:flex; flex-direction:column; text-decoration:none; color:inherit;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-5px); border-color:var(--accent);
    box-shadow:0 14px 28px rgba(0,0,0,0.35),
               0 0 0 1px var(--accent),
               0 0 26px -4px color-mix(in srgb, var(--accent) calc(var(--glow) * 100%), transparent);
    outline:none;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .card:hover, .card:focus-visible{ transform:none; }
  }
  .card::before{ content:""; position:absolute; top:0; left:20px; right:20px; height:4px; background:var(--accent); border-radius:0 0 6px 6px; }

  .icon-row{ display:flex; align-items:center; gap:12px; margin:6px 0 10px; }
  .icon{ width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:var(--panel-raised); border:2px solid var(--accent); flex-shrink:0; }
  .title{ font-weight:800; font-size:1.06rem; letter-spacing:0.01em; }
  .cat-tag{ font-size:0.64rem; color:var(--accent); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; margin-top:2px; }

  .blurb{ color:var(--dim); font-size:0.84rem; line-height:1.4; margin:0 0 16px; flex-grow:1; }

  .scoreboard{ background:var(--score-bg); border-radius:10px; padding:8px 12px; display:flex; justify-content:center; font-family:"SFMono-Regular","Menlo","Consolas",monospace; font-size:0.72rem; letter-spacing:0.03em; color:var(--marquee); border:1px solid var(--chip-border); }
  .scoreboard .label{ color:var(--dim); margin-right:4px; }

  .play-btn{ margin-top:12px; text-align:center; font-weight:800; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; padding:9px; border-radius:10px; background:var(--accent); color:#1a1330; }

  .empty-note{ text-align:center; color:var(--dim); max-width:500px; margin:60px auto; font-size:0.9rem; }
</style>
</head>
<body data-theme="neon">

<header>
  <div class="marquee">Kenmemorize Arcade</div>
  <p>Pick a game. Play counts are shared by everyone.</p>
</header>

<div class="filters" id="filters"></div>
<div id="sections"></div>
<div class="empty-note" id="emptyNote" style="display:none;">No games configured yet — add entries to the GAMES array.</div>

<script>
/* =========================================================
   CATEGORIES — memory-skill groups. Order here = display order.
   ========================================================= */
const CATEGORIES = [
  { key:"spatial",  label:"Spatial",  icon:"🧭", color:"var(--c-spatial)"  },
  { key:"visual",   label:"Visual",   icon:"👁️", color:"var(--c-visual)"   },
  { key:"numeric",  label:"Numeric",  icon:"🔢", color:"var(--c-numeric)"  },
  { key:"sequence", label:"Sequence", icon:"🔗", color:"var(--c-sequence)" },
  { key:"logic",    label:"Logic",    icon:"🧩", color:"var(--c-logic)"    },
];

/* =========================================================
   CONFIG — the offline fallback roster.
   skill : one of the category keys above (drives colour + group)
   Best score is read from localStorage key  best:{id}
   Total plays are read from Firebase  /globalStats/{id}/totalPlays
   This list is the "last known good" roster used only if Firebase
   is unreachable. The live roster is BUILTIN_GAMES merged with
   whatever is in Firebase at /games (added/edited/deleted via
   admin.html) — see mergeGames() below. Don't hand-edit this array
   to add a game; use admin.html so the change is visible to everyone.
   index.html sits at the repo root and the games live in games/,
   so every url is "games/<file>.html". No "../" anywhere.
   ========================================================= */
const BUILTIN_GAMES = [
  { id:"tidal-recall",     name:"Tidal Recall",       skill:"visual",   blurb:"Working-memory game — spot the new item washed in by the tide. Classic, Zen, and pass-and-play PvP.", url:"games/tidal_recall.html",       icon:"🌊" },
  { id:"hue-recall",       name:"Hue Recall",         skill:"visual",   blurb:"Recall mixed brand-logo colours; scored on colour distance. Solo, Endless, Practice, and PvP.",       url:"games/hue-recall.html",         icon:"🎨" },
  { id:"ring-match",       name:"Ring Match",         skill:"spatial",   blurb:"Colour-matching slider puzzle with Zen and PvP race modes.",                                          url:"games/ring-match.html",         icon:"🎯" },
  { id:"overlap-pictures", name:"Overlapping Pictures", skill:"visual", blurb:"Competition-format memory-sports trainer with a 300-icon pool.",                                     url:"games/overlapping-picture-memory-game.html", icon:"🖼️" },
  { id:"memory-mash",      name:"Memory Mash",        skill:"visual",   blurb:"Kim's-Game-style recall — How Many? and What's Missing?, with an optional timed Competition run.", url:"games/memory-mash.html",        icon:"🃏" },
  { id:"vision-test",      name:"VisionTest",         skill:"visual",   blurb:"Eye-chart orientation recall. Easy (C directions) or Hard (mixed letters).",                          url:"games/vision-test.html",        icon:"👁️" },
  { id:"quad-twist",       name:"Quad Twist",         skill:"spatial",  blurb:"Rotation puzzle in Classic and Numbers modes on 4×4, 6×6, and 8×8 grids.",                            url:"games/quad_twist.html",         icon:"🔄" },
  { id:"ricochet-recall",  name:"Ricochet Recall",    skill:"spatial",  blurb:"Predict the mirror-bounce path. Solo (3 lives) or pass-and-play PvP.",                                url:"games/ricochet-recall.html",    icon:"🪞" },
  { id:"voxel-vault",      name:"Voxel Vault",        skill:"spatial",  blurb:"Spatial memory across four modes — count, rebuild, spot the odd one out, or assemble the pair.",      url:"games/voxel_vault.html",        icon:"🧊" },
  { id:"stone-spotter",    name:"Stone Spotter",      skill:"spatial",  blurb:"Memorise a weiqi board, then spot the stones that were added while you looked away.",              url:"games/stone_spotter.html",      icon:"⚫" },
  { id:"memomath",         name:"MemoMath",           skill:"numeric",  blurb:"Memorise each coloured digit, then recall it and do the maths. Practice or Competition.",             url:"games/memomath.html",           icon:"🔐" },
  { id:"hexasum",          name:"HexaSum",            skill:"numeric",  blurb:"Hexagonal number-line sum puzzle. Solo and PvP.",                                                     url:"games/hexsum.html",             icon:"➕" },
  { id:"roll-remember",    name:"Roll & Remember",    skill:"visual" ,  blurb:"Face-grid dice recall for 1–4 players.",                                                              url:"games/roll_and_recall.html",    icon:"🎲" },
  { id:"cart-recall",      name:"Cart Recall",        skill:"visual"  , blurb:"Race to rebuild the shopping list from memory — online multiplayer with room codes.",                url:"games/cart_recall_pvp.html",    icon:"🛒" },
  { id:"conveyor-clash",   name:"Conveyor Clash",     skill:"sequence", blurb:"A two-player belt-racing memory duel on one device.",                                                url:"games/conveyor_clash.html",     icon:"🏭" },
  { id:"circuit-cascade",  name:"Circuit Cascade",    skill:"logic",    blurb:"Logic-circuit chip placement across Easy, Medium, Hard, and Expert.",                                 url:"games/circuit-cascade.html",    icon:"⚡" },
];

let GAMES = BUILTIN_GAMES;

/* Merge the offline fallback roster with the live Firebase overlay.
   Overlay entries with the same id override/edit a builtin game or
   add a new one; { deleted:true } removes a game (builtin or custom). */
function mergeGames(overlay){
  const map = new Map(BUILTIN_GAMES.map(g => [g.id, g]));
  const additions = [];
  for(const [id, g] of Object.entries(overlay || {})){
    if(!g) continue;
    if(g.deleted){ map.delete(id); continue; }
    const game = { id, name:g.name, skill:g.skill, blurb:g.blurb, url:g.url, icon:g.icon || "🎮" };
    if(map.has(id)) map.set(id, game);
    else additions.push({ game, createdAt:g.createdAt || 0 });
  }
  additions.sort((a,b) => a.createdAt - b.createdAt);
  return [...map.values(), ...additions.map(a => a.game)];
}

/* =========================================================
   FIREBASE — same Realtime Database as your PvP games.
   Global play counter lives at /globalStats/{id}/totalPlays.
   To increment on a game's start, that game calls (once):
     PATCH  {DB}/globalStats/{id}.json   or a transaction +1.
   The games roster overlay (added/edited/deleted via admin.html)
   lives at /games/{id}. The hub only READS both here.
   ========================================================= */
const FIREBASE_DB_URL = "https://kenmemorize-arcade-default-rtdb.firebaseio.com";

/* Firebase returns HTTP 200 with a body like {"error":"Permission denied"}
   when rules block a path — that's not a network failure, so `res.ok` alone
   isn't enough. Treat anything that isn't a plain data object as empty. */
function asDataObject(v){
  return (v && typeof v === "object" && !Array.isArray(v) && !v.error) ? v : {};
}

async function fetchGlobalStats(){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/globalStats.json`);
    if(!res.ok) return {};
    return asDataObject(await res.json());
  }catch(e){
    console.warn("Global stats fetch failed (check FIREBASE_DB_URL):", e);
    return {};
  }
}

async function fetchGamesOverlay(){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/games.json`);
    if(!res.ok) return {};
    return asDataObject(await res.json());
  }catch(e){
    console.warn("Games overlay fetch failed (check FIREBASE_DB_URL):", e);
    return {};
  }
}

/* Plays is the ONLY stat the hub shows. A per-game "best" was removed on
   request — not every game has a meaningful single best score, and the ones
   that do (Quad Twist times, Circuit Cascade leaderboards, …) keep tracking
   it INSIDE the game where it has context. Don't reintroduce a BEST field or
   a popularity rank medal here without asking. */
function cardTemplate(game, stats, catColor){
  const plays = (stats[game.id]?.totalPlays) || 0;
  const catLabel  = (CATEGORIES.find(c=>c.key===game.skill)||{}).label || game.skill;
  return `
    <a class="card" style="--accent:${catColor}" href="${game.url}">
      <div class="icon-row">
        <div class="icon">${game.icon}</div>
        <div>
          <div class="title">${game.name}</div>
          <div class="cat-tag">${catLabel}</div>
        </div>
      </div>
      <p class="blurb">${game.blurb}</p>
      <div class="scoreboard">
        <div><span class="label">PLAYS</span>${plays.toLocaleString()}</div>
      </div>
      <div class="play-btn">Play</div>
    </a>
  `;
}

function renderFilters(activeCats){
  const el = document.getElementById("filters");
  const catChips = CATEGORIES
    .filter(c => GAMES.some(g => g.skill === c.key))
    .map(c => {
      const on = activeCats.has(c.key);
      return `<button class="chip" data-cat="${c.key}" style="--chip-c:${c.color}" aria-pressed="${on}"><span class="dot"></span>${c.icon} ${c.label}</button>`;
    }).join("");
  const allOn = CATEGORIES.every(c => !GAMES.some(g=>g.skill===c.key) || activeCats.has(c.key));
  el.innerHTML = `<button class="chip" data-cat="__all" aria-pressed="${allOn}">All</button>` + catChips;
}

async function render(){
  const sectionsEl = document.getElementById("sections");
  const emptyNote  = document.getElementById("emptyNote");

  const [stats, overlay] = await Promise.all([fetchGlobalStats(), fetchGamesOverlay()]);
  GAMES = mergeGames(overlay);
  if(GAMES.length === 0){ emptyNote.style.display = "block"; return; }

  // build one section per non-empty category
  let html = "", delay = 0;
  for(const cat of CATEGORIES){
    const games = GAMES.filter(g => g.skill === cat.key);
    if(!games.length) continue;
    const cards = games.map((g,i) => {
      const c = cardTemplate(g, stats, cat.color);
      return c.replace('class="card"', `class="card" data-delay="${delay+i}"`);
    }).join("");
    delay += games.length;
    html += `
      <div class="section-head" data-cat-sec="${cat.key}" style="--sc:${cat.color}">
        <h2>${cat.icon} ${cat.label}</h2><div class="rule"></div><div class="count">${games.length}</div>
      </div>
      <div class="grid" data-cat-grid="${cat.key}">${cards}</div>`;
  }
  sectionsEl.innerHTML = html;

  // stagger entrance
  document.querySelectorAll(".card").forEach(el => {
    el.style.animationDelay = `${parseInt(el.getAttribute("data-delay")||"0",10) * 40}ms`;
  });

  // ---- filter chips ----
  const activeCats = new Set(CATEGORIES.map(c=>c.key));
  renderFilters(activeCats);

  function applyFilter(){
    for(const cat of CATEGORIES){
      const show = activeCats.has(cat.key);
      const sec  = document.querySelector(`[data-cat-sec="${cat.key}"]`);
      const grid = document.querySelector(`[data-cat-grid="${cat.key}"]`);
      if(sec)  sec.style.display  = show ? "" : "none";
      if(grid) grid.style.display = show ? "" : "none";
    }
    renderFilters(activeCats);
  }

  document.getElementById("filters").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if(!btn) return;
    const cat = btn.getAttribute("data-cat");
    if(cat === "__all"){
      CATEGORIES.forEach(c => activeCats.add(c.key));
    }else{
      if(activeCats.has(cat)) activeCats.delete(cat); else activeCats.add(cat);
      // never allow an all-empty view: re-enable all if nothing left
      if(activeCats.size === 0) CATEGORIES.forEach(c => activeCats.add(c.key));
    }
    applyFilter();
  });
}

render();
</script>
</body>
</html>
